name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The engine tests drive Playwright directly; the Electron binary isn't needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Smoke tests that run against local pages. `smoke`, `smoke:adblock` and
      # `smoke:profile` reach real websites, so they stay manual to keep CI stable.
      - run: npm run smoke:offline
