name: Release

# Builds the installers and attaches them to a GitHub release.
#   - push a tag:  git tag v0.2.0 && git push origin v0.2.0
#   - or run it by hand from the Actions tab (Run workflow)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish as (e.g. v0.2.0). Leave empty for a draft named after the version.'
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows installer
            build: npm run dist:win
            artifacts: 'dist/*.exe'
          - os: ubuntu-latest
            name: Linux AppImage and deb
            build: npm run dist:linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Bundles its own Chromium into the installer, so users need nothing else.
      - run: ${{ matrix.build }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-installers
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    # electron-builder uploads each platform's installer to a draft release as it
    # builds (and the update metadata beside it). Once every platform is in, make
    # that draft public.
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft=false --latest
          gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name'
